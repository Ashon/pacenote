# Pacenote's read-only account for one cluster (pacenote/pacenote-ro). Settings > Tools > Kubernetes makes it
# for you, or copies it for the cluster's admin. By hand: save it as a file and run kubectl apply -f with it.
#
# - Namespaced resources are read with the built-in ClusterRole view, which leaves out secrets.
# - Cluster resources such as nodes, namespaces, storage and metrics are read with pacenote-ro-cluster.
# - Nothing can be changed. A separate account keeps Pace's lookups apart in the audit log, and
#   removing it takes two commands:
#   kubectl delete namespace pacenote
#   kubectl delete clusterrolebinding,clusterrole -l app=pacenote
apiVersion: v1
kind: Namespace
metadata:
  name: pacenote
  labels:
    app: pacenote
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pacenote-ro
  namespace: pacenote
  labels:
    app: pacenote
---
apiVersion: v1
kind: Secret
metadata:
  name: pacenote-ro-token
  namespace: pacenote
  annotations:
    kubernetes.io/service-account.name: pacenote-ro
  labels:
    app: pacenote
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pacenote-ro-view
  labels:
    app: pacenote
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: pacenote-ro
    namespace: pacenote
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pacenote-ro-cluster
  labels:
    app: pacenote
rules:
  - apiGroups: [""]
    resources: [nodes, namespaces, persistentvolumes]
    verbs: [get, list, watch]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [nodes, pods]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pacenote-ro-cluster
  labels:
    app: pacenote
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pacenote-ro-cluster
subjects:
  - kind: ServiceAccount
    name: pacenote-ro
    namespace: pacenote
