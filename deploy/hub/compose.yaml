# Pacenote team hub on a server of its own (docs/team-hub.md).
#   cp hub.env.example hub.env                  # the Slack app's tokens live only here
#   docker compose up -d                        # pulls the image each release publishes
#   docker compose pull && docker compose up -d # later, to update
# From the repository instead: pnpm bundle, then docker compose up -d --build.
# The hub listens on 127.0.0.1:8790; put HTTPS in front of it (Caddy, nginx, or a tunnel) and give members that URL.
# Or, on a network of your own, publish it there ("8790:8790") and give members http://<the server's address>:8790.
name: pacenote-hub
services:
  hub:
    # latest follows releases. Name a version instead (ghcr.io/ashon/pacenote-hub:0.5.0) to stay on one.
    image: ghcr.io/ashon/pacenote-hub:latest
    build: .
    restart: unless-stopped
    env_file: hub.env
    ports:
      - "127.0.0.1:8790:8790"
    volumes:
      - hub-data:/data
volumes:
  hub-data:
