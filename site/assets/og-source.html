<!doctype html>
<!--
  Source for assets/og.png, the link preview card. It is not linked from the page; it is kept so the
  image can be redrawn rather than re-made. From the repository root, render it at 2x and downsample,
  which antialiases the type better than rendering straight to 1200x630:

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
      --headless=new --disable-gpu --hide-scrollbars --force-device-scale-factor=2 \
      --window-size=1200,630 --virtual-time-budget=4000 \
      --screenshot=og@2x.png "file://$PWD/site/assets/og-source.html"
    sips -z 630 1200 og@2x.png --out site/assets/og.png

  Keep it in step with style.css, and at 1200x630: index.html declares that size.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root {
    --canvas: oklch(0.975 0.01 165);
    --card: oklch(1 0 0);
    --foreground: oklch(0.23 0.025 172);
    --muted-foreground: oklch(0.49 0.03 172);
    --primary: #007c5c;
    --track: #0cb67e;
    --sans: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: var(--canvas);
    color: var(--foreground);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    padding: 36px;
  }
  .card {
    height: 100%;
    background: var(--card);
    border-radius: 24px;
    box-shadow: 0 1px 2px oklch(0.3 0.03 170 / 0.05), 0 10px 28px -14px oklch(0.3 0.03 170 / 0.14);
    padding: 52px 64px 0;
    display: flex;
    flex-direction: column;
  }
  .brand { display: flex; align-items: center; gap: 14px; font-size: 28px; font-weight: 650; }
  .brand img { width: 40px; height: 40px; }
  h1 {
    margin: 36px 0 0;
    font-size: 72px;
    line-height: 1.02;
    letter-spacing: -0.035em;
    font-weight: 750;
  }
  p { margin: 26px 0 0; font-size: 28px; line-height: 1.4; max-width: 30em; color: var(--muted-foreground); letter-spacing: -0.01em; }
  .facts { margin-top: auto; margin-bottom: 52px; display: flex; gap: 12px; }
  .facts span { padding: 6px 16px; border-radius: 99px; background: oklch(0.945 0.018 165); color: oklch(0.3 0.05 168); font-size: 21px; font-weight: 550; }
</style>
</head>
<body>
  <div class="card">
    <div class="brand"><img src="../../assets/pacenote-mark.svg" alt="">Pacenote</div>
    <h1>Ask in Slack.<br>Pick it up in your terminal.</h1>
    <p>Your own AI assistant in Slack, on your Mac. It answers only you, on your own Claude or ChatGPT plan.</p>
    <div class="facts"><span>Free and open source</span><span>No telemetry</span></div>
  </div>
</body>
</html>
