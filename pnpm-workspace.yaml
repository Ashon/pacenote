packages:
  - "apps/*"

allowBuilds:
  esbuild: true

overrides:
  # @tailwindcss/typography (0.5.20 too) pins 6.0.10, open to quadratic-time
  # parsing of a long selector (GHSA-rj75-hqrm-r3gf); 7.1.6 has the fix and the
  # plugin's output is the same with it
  '@tailwindcss/typography>postcss-selector-parser': 7.1.6
