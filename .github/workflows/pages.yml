name: pages

# pacenote.dev: site/ published to GitHub Pages, with the custom domain set in the repository's Pages
# settings (build_type workflow, so no CNAME file is needed).
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'assets/pacenote-mark.svg'
      - '.github/workflows/pages.yml'
  # The release link above the headline names the latest release. Releases are published with the maintainer's own gh, so
  # the release event does reach this workflow. It runs on the release's tag, which the github-pages environment does not
  # deploy from, so it only starts this workflow again on main (relay below).
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # A workflow_dispatch started with GITHUB_TOKEN does start a run, unlike other events it starts.
  relay:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "${{ github.repository }}" --ref main

  deploy:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The mark has one home, beside the app's other assets; the site gets a copy.
      - name: stage
        run: |
          set -euo pipefail
          mkdir -p site/media
          cp assets/pacenote-mark.svg site/media/
      - name: stamp the latest release
        env:
          # Authenticated: an anonymous call from a runner shares its rate limit with every other runner on that IP
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(gh api "repos/${{ github.repository }}/releases/latest" --jq .tag_name)
          test -n "$version" || { echo "could not read the latest release tag" >&2; exit 1; }
          # Each home page's link, in its language: the English one and the Korean one in ko/
          stamp() {
            local page=$1 words=$2
            test "$(grep -c 'id="release-link"' "$page")" -eq 1 || { echo "expected one release-link in $page" >&2; exit 1; }
            sed -i -E "s|(<a class=\"release\" id=\"release-link\" href=\")[^\"]*(\">)[^<]*</a>|\1https://github.com/${{ github.repository }}/releases/tag/${version}\2${words}</a>|" "$page"
            grep -o '<a class="release" id="release-link"[^<]*</a>' "$page" | grep -F "$words"
          }
          stamp site/index.html "What's new in ${version}"
          stamp site/ko/index.html "${version}에서 달라진 점"
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
